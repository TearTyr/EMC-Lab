<!DOCTYPE html>
<!--
  tools/og-card.html — SOURCE ARTWORK for img/og-card.png (1200x630).

  This file is dev-only: it is never copied into public/ and no page links to
  it. It exists so the social preview image can be regenerated instead of
  hand-edited in a paint program:

      node tools/make-og-card.mjs        (needs puppeteer installed anywhere)

  The PNG itself IS committed (img/og-card.png) because the six pages point at
  an absolute URL for it — a scraper fetches that file, it never renders this
  HTML. Re-run the generator whenever the brand colours, the mascot, the counts
  (topics / simulations / quiz questions) or the fonts change, then commit the
  new PNG.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EMC Lab — social card</title>
  <link rel="stylesheet" href="../css/fonts.css">
  <style>
    :root {
      --bg: #17181c; --panel: #1b1d22; --panel-2: #22242b; --plate: #101114;
      --line: #2e3138; --text: #edebe3; --text-dim: #b9b7ae; --text-faint: #9a988e;
      --pk: #f8aebe; --li: #d5b8d8; --mi: #b5d777; --sk: #a8d3e0; --ye: #f6d36b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'G8321', 'Hiragino Maru Gothic ProN', 'Segoe UI', system-ui, sans-serif;
      position: relative;
    }
    /* faint blueprint grid + two soft glows, like the site hero */
    .grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(168, 211, 224, .055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168, 211, 224, .055) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(120% 100% at 20% 40%, #000 25%, transparent 78%);
      -webkit-mask-image: radial-gradient(120% 100% at 20% 40%, #000 25%, transparent 78%);
    }
    .glow-a, .glow-b { position: absolute; border-radius: 50%; filter: blur(90px); }
    .glow-a { width: 520px; height: 520px; left: -140px; top: -180px; background: rgba(248, 174, 190, .16); }
    .glow-b { width: 460px; height: 460px; right: -120px; bottom: -190px; background: rgba(168, 211, 224, .14); }

    .card {
      position: absolute; inset: 46px;
      border: 1.5px solid var(--line); border-radius: 26px;
      background: linear-gradient(155deg, rgba(34, 36, 43, .92), rgba(16, 17, 20, .92));
      display: flex; flex-direction: column; padding: 54px 62px 44px;
    }
    .row { display: flex; align-items: center; gap: 56px; flex: 1 1 auto; min-height: 0; }
    .mascot { flex: none; width: 216px; height: 216px; }
    .mascot svg { width: 100%; height: 100%; display: block; }

    .body { flex: 1 1 auto; min-width: 0; }
    .eyebrow {
      font-size: 19px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase;
      color: var(--pk); margin-bottom: 16px;
    }
    h1 {
      font-size: 88px; font-weight: 700; line-height: 1; letter-spacing: -.01em;
      color: var(--text);
    }
    h1 em { font-style: normal; color: var(--pk); }
    .sub { font-size: 25px; line-height: 1.45; color: var(--text-dim); margin-top: 18px; max-width: 34ch; }

    .chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
    .chip {
      font-size: 19px; font-weight: 700; padding: 8px 18px; border-radius: 999px;
      border: 1.5px solid var(--line); background: rgba(27, 29, 34, .9); color: var(--text-dim);
    }
    .chip.c1 { border-color: rgba(248, 174, 190, .5);  color: var(--pk); }
    .chip.c2 { border-color: rgba(246, 211, 107, .5);  color: var(--ye); }
    .chip.c3 { border-color: rgba(213, 184, 216, .5);  color: var(--li); }
    .chip.c4 { border-color: rgba(168, 211, 224, .5);  color: var(--sk); }

    .foot {
      margin-top: 30px; padding-top: 24px; border-top: 1.5px solid var(--line);
      display: flex; align-items: center; gap: 16px;
      font-size: 21px; color: var(--text-faint); letter-spacing: .02em;
    }
    .foot b { color: var(--mi); font-weight: 700; }
    .foot .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--edge, #3a3d45); }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow-a"></div>
  <div class="glow-b"></div>

  <div class="card">
    <div class="row">
    <div class="mascot">
      <!-- same artwork as the site favicon and header brand mark, scaled up -->
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <rect width="48" height="48" rx="14" fill="#17181c"/>
        <path d="M15 15 C13 7 19 5 21 11" fill="#f6f1e5" stroke="#3a3d45" stroke-width="2"/>
        <path d="M33 15 C35 7 29 5 27 11" fill="#f6f1e5" stroke="#3a3d45" stroke-width="2"/>
        <ellipse cx="24" cy="27" rx="16" ry="15" fill="#f6f1e5" stroke="#3a3d45" stroke-width="2"/>
        <circle cx="18.5" cy="26" r="1.7" fill="#2b2d33"/><circle cx="29.5" cy="26" r="1.7" fill="#2b2d33"/>
        <path d="M22 31 q2 2 4 0" stroke="#2b2d33" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <circle cx="13.5" cy="30" r="2.4" fill="#f8aebe" opacity=".85"/><circle cx="34.5" cy="30" r="2.4" fill="#f8aebe" opacity=".85"/>
      </svg>
    </div>

    <div class="body">
      <div class="eyebrow">Interactive physics</div>
      <h1>EMC<em>Lab</em></h1>
      <p class="sub">See physics move — every number on screen is computed from the real equations.</p>
      <div class="chips">
        <span class="chip c2">1 · Circuits &amp; Ohm’s Law</span>
        <span class="chip c1">2 · Electric Fields &amp; Coulomb’s Law</span>
        <span class="chip c3">3 · Magnetism &amp; Induction</span>
      </div>    </div>
    </div>

    <div class="foot">
      <span>5 topics</span><span class="dot"></span>
      <span>9 live simulations</span><span class="dot"></span>
      <span><b>30</b>-question scored quiz</span>
    </div>
  </div>
</body>
</html>
